# Render Blueprint — 게임과 상점 API를 한 프로세스에서 서빙한다.
#
# 같은 오리진이라 CORS 가 없고, HttpOnly 세션 쿠키가 결제 복귀 후에도 따라온다.
# 이 통합에서 실제로 겪은 버그가 정확히 그 반대 상황(오리진 불일치)이었다.
#
# 배포:
#   Render 대시보드 → New → Blueprint → 이 저장소 선택.
#   NEON_API_KEY 와 NEON_WEBHOOK_SECRET 은 sync:false 라서 대시보드에서 직접
#   입력하게 된다 — 저장소에도, 이 파일에도 들어가지 않는다.
services:
  - type: web
    name: constellation-defense
    runtime: node
    plan: free
    region: singapore

    # NODE_ENV=production 이 기본이라 npm ci 가 devDependencies 를 건너뛴다.
    # esbuild 가 devDependency 이므로 --include=dev 가 없으면 빌드가
    # "esbuild: not found" 로 죽는다. electron 도 devDependency 인데 런타임에는
    # 쓰지 않으므로 바이너리 다운로드만 막는다.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/serve.mjs
    healthCheckPath: /

    envVars:
      # 컨테이너 밖에서 들어오므로 루프백 바인딩으로는 닿지 않는다.
      - key: HOST
        value: 0.0.0.0
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: NEON_MOCK_CHECKOUT
        value: "0"
      - key: NEON_ENVIRONMENT
        value: sandbox
      - key: NEON_API_URL
        value: https://api.neonpay.com
      # PUBLIC_URL 은 일부러 비워 둔다. 비어 있으면 서버가 요청 오리진을 쓰고,
      # Render 가 x-forwarded-proto/host 를 붙여 주므로 https://<앱>.onrender.com
      # 이 그대로 잡힌다. 손으로 적으면 오타 하나로 쿠키가 끊긴다.
      - key: NEON_API_KEY
        sync: false
      - key: NEON_WEBHOOK_SECRET
        sync: false
